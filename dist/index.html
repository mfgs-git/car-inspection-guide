<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1426" />
  <meta name="description" content="A step-by-step photo guide for documenting a vehicle's condition." />
  <title>Car Inspection Guide</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1426'/%3E%3Cpath d='M14 37l5-14h26l5 14v11h-6v-5H20v5h-6V37zm8-9l-3 9h26l-3-9H22z' fill='%2328a5ff'/%3E%3Ccircle cx='22' cy='39' r='3' fill='white'/%3E%3Ccircle cx='42' cy='39' r='3' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="backBtn" aria-label="Go back">←</button>
      <div>
        <p class="eyebrow">PHOTO CHECKLIST</p>
        <h1>Car inspection guide</h1>
      </div>
      <div class="progress-ring" id="progressRing" aria-label="Inspection progress"><span id="progressText">0%</span></div>
    </header>

    <section id="overview" class="overview" aria-label="Inspection overview">
      <div class="intro">
        <span class="step-pill">12 required photos</span>
        <h2>Document every angle</h2>
        <p>Follow the guide in order. Keep the whole car part in frame and use bright, even light.</p>
      </div>
      <div id="sectionList" class="section-list"></div>
    </section>

    <section id="guide" class="guide hidden" aria-live="polite">
      <div class="guide-media">
        <img id="guideImage" alt="" />
        <div class="image-shade"></div>
        <span id="sectionBadge" class="section-badge"></span>
      </div>
      <div class="guide-body">
        <div id="dots" class="dots" aria-hidden="true"></div>
        <p id="stepCount" class="eyebrow"></p>
        <h2 id="guideTitle"></h2>
        <p id="guideCopy" class="guide-copy"></p>
        <div class="capture-panel">
          <button id="cameraBtn" class="camera-button" type="button">
            <span class="camera-icon" aria-hidden="true">●</span>
            <span id="cameraLabel">Take photo</span>
          </button>
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
          <button id="savePhotoBtn" class="save-button hidden" type="button">Save to iPhone Photos</button>
          <p id="captureStatus">Opens the rear camera on your phone.</p>
        </div>
        <div class="guide-actions">
          <button id="prevBtn" class="secondary">Previous</button>
          <button id="nextBtn" class="primary">Next photo <span>→</span></button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
